<!DOCTYPE html>
<html lang="pt">
<head>
    <title>EletroSync • Definir nova palavra-passe</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/design-system.css">

    <style>
        body {
            min-height: 100vh;
            display: flex; flex-direction: column;
            background: linear-gradient(135deg, var(--es-primary-subtle) 0%, var(--es-primary-light) 100%);
        }
        .auth-header { padding: 24px 0; text-align: center; }
        .auth-header img { height: 44px; }
        .auth-main { flex: 1; display: flex; align-items: center; padding: 24px 0; }
        .auth-card {
            background: var(--es-white);
            border-radius: var(--es-radius-xl);
            box-shadow: var(--es-shadow-xl);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }
        .auth-card h1 { font-size: 1.5rem; margin: 0 0 8px; text-align: center; }
        .auth-card .subtitle { color: var(--es-text-muted); text-align: center; margin-bottom: 32px; font-size: 0.9375rem; }
        .auth-card .form-label { font-size: 0.875rem; font-weight: 600; color: var(--es-gray-700); margin-bottom: 6px; }
        .auth-card .form-control {
            padding: 12px 16px;
            font-size: 0.9375rem;
            border: 1.5px solid var(--es-gray-300);
            border-radius: var(--es-radius-md);
            transition: all var(--es-transition);
        }
        .auth-card .form-control:focus {
            border-color: var(--es-primary);
            box-shadow: var(--es-shadow-focus);
        }
        @media (max-width: 480px) { .auth-card { padding: 28px 20px; } }
    </style>
</head>
<body>

<header class="auth-header">
    <a href="index.html"><img src="images/logo3.png" alt="EletroSync"></a>
</header>

<main class="auth-main">
    <div class="container">
        <div class="auth-card">
            <h1>Definir nova palavra-passe</h1>
            <p class="subtitle">Escolhe uma palavra-passe segura para a tua conta.</p>

            <div id="reset-error" class="alert alert-danger d-none mb-3" role="alert"></div>

            <form id="reset-form" novalidate>
                <div class="mb-3">
                    <label for="new-password" class="form-label">Nova palavra-passe</label>
                    <div class="es-pwd-toggle-wrap">
                        <input type="password" class="form-control" id="new-password" name="password" required
                               minlength="8" maxlength="72" autocomplete="new-password"
                               placeholder="Mínimo 8 caracteres">
                        <button type="button" class="es-pwd-toggle-btn" aria-label="Mostrar palavra-passe" aria-pressed="false">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirm-new-password" class="form-label">Confirmar palavra-passe</label>
                    <div class="es-pwd-toggle-wrap">
                        <input type="password" class="form-control" id="confirm-new-password" name="confirm" required
                               minlength="8" maxlength="72" autocomplete="new-password"
                               placeholder="Repete a nova palavra-passe">
                        <button type="button" class="es-pwd-toggle-btn" aria-label="Mostrar palavra-passe" aria-pressed="false">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="es-btn es-btn-primary es-btn-lg w-100" id="reset-submit">
                    Atualizar palavra-passe
                </button>
            </form>

            <p class="text-center mt-4 small">
                <a href="login.html" style="color: var(--es-primary); text-decoration: none;">Voltar ao login</a>
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui-layout.js"></script>
<script>
(function () {
    const form        = document.getElementById('reset-form');
    const errEl       = document.getElementById('reset-error');
    const submitBtn   = document.getElementById('reset-submit');
    const pwd1        = document.getElementById('new-password');
    const pwd2        = document.getElementById('confirm-new-password');

    function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove('d-none');
    }
    function clearError() { errEl.classList.add('d-none'); }

    // Supabase coloca os tokens no hash:
    // #access_token=...&refresh_token=...&expires_in=3600&token_type=bearer&type=recovery
    function readTokenFromHash() {
        const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
        const params = new URLSearchParams(hash);
        return {
            accessToken:  params.get('access_token'),
            refreshToken: params.get('refresh_token'),
            type:         params.get('type'),
            error:        params.get('error_description') || params.get('error'),
        };
    }

    const { accessToken, refreshToken, type, error } = readTokenFromHash();

    if (error) {
        showError('Link inválido ou expirado: ' + error);
        submitBtn.disabled = true;
    } else if (!accessToken || !refreshToken || type !== 'recovery') {
        showError('Link de recuperação inválido. Pede um novo email no login.');
        submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const p1 = pwd1.value;
        const p2 = pwd2.value;
        if (p1.length < 8) { showError('A palavra-passe tem de ter pelo menos 8 caracteres.'); return; }
        if (p1 !== p2)     { showError('As palavras-passe não coincidem.'); return; }

        submitBtn.disabled = true;
        const original = submitBtn.innerHTML;
        submitBtn.innerHTML = 'A atualizar…';

        try {
            const res = await (window.fetchWithTimeout || fetch)('/api/auth/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    access_token: accessToken,
                    refresh_token: refreshToken,
                    password: p1,
                }),
            }, 10000);
            const data = await res.json().catch(() => ({}));

            if (res.ok) {
                if (window.Toast) window.Toast.success('Palavra-passe atualizada. A redirecionar para o login…');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showError(data.error || 'Não foi possível atualizar a palavra-passe.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = original;
            }
        } catch {
            showError('Erro de conexão. Tenta novamente.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = original;
        }
    });
})();
</script>
</body>
</html>
